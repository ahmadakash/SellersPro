
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | sellersPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-login-page">

  <main class="login-card">
    <a href="../home/index.html" class="admin-brand">
      <span class="brand-icon"><i class="bi bi-shop"></i></span>
      <span>sellers<span>Pro</span></span>
    </a>

    <div class="login-heading">
      <div class="admin-shield"><i class="bi bi-shield-lock"></i></div>
      <h1>Admin Portal</h1>
      <p>Sign in to manage your SellersPro platform.</p>
    </div>

    <div class="admin-alert" id="loginMessage" role="alert" hidden></div>

    <form id="adminLoginForm">
      <label for="adminEmail">Admin email</label>
      <div class="admin-input-wrap">
        <i class="bi bi-envelope"></i>
        <input type="email" id="adminEmail" placeholder="Enter admin email" required autocomplete="username">
      </div>

      <label for="adminPassword">Password</label>
      <div class="admin-input-wrap">
        <i class="bi bi-lock"></i>
        <input type="password" id="adminPassword" placeholder="Enter password" required autocomplete="current-password">
        <button type="button" id="togglePassword" aria-label="Show password">
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <button type="submit" class="admin-login-btn" id="adminLoginBtn">
        <span>Sign in to Admin Panel</span>
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <p class="login-security">
      <i class="bi bi-shield-check"></i>
      Restricted access. Authorized administrators only.
    </p>
  </main>

  <script type="module" src="../../assets/js/admin/admin-login.js"></script>
</body>
</html>
