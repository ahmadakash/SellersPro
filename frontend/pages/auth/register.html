<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - SellersPro</title>

    <link
        rel="stylesheet"
        href="../../assets/css/global.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/auth.css"
    >
</head>

<body>

    <main class="auth-layout">

        <!-- LEFT SIDE -->

        <section class="auth-sidebar">

            <div class="auth-brand">
                    <div class="brand-icon">S</div>
                    <a
                        href="../home/index.html"
                        class="brand-link"
                    >
                        <span>SellersPro</span>
                    </a>
                </div>


            <div class="auth-intro">

                <h1>
                    Run your shop<br>
                    from one place.
                </h1>

                <p>
                    Track orders, manage products, keep an eye on stock,
                    and understand your sales — all in one clean dashboard.
                </p>

            </div>


            <div class="auth-stats">

                <div class="auth-stat">
                    <span>Orders tracked</span>
                    <strong>10+</strong>
                </div>

                <div class="auth-stat">
                    <span>Small businesses</span>
                    <strong>20+</strong>
                </div>

                <div class="auth-stat">
                    <span>Products managed</span>
                    <strong>100+</strong>
                </div>

            </div>

        </section>


        <!-- RIGHT SIDE -->

        <section class="auth-main">

            <div class="register-form-container">

                <div class="auth-heading">

                    <h2>Create your account</h2>

                    <p>
                        Get started — it's free
                    </p>

                </div>


                <form
                    id="registerForm"
                    novalidate
                >

                    <!-- Full Name + Business Name -->

                    <div class="form-row">

                        <div class="form-group">

                            <label for="fullName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Rabeya Rima"
                                autocomplete="name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="businessName">
                                Business Name
                            </label>

                            <input
                                type="text"
                                id="businessName"
                                name="businessName"
                                placeholder="Fashion bd"
                                autocomplete="organization"
                                required
                            >

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@business.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="01XXXXXXXXX"
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-input-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Min 8 characters"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="password"
                                aria-label="Show password"
                            >
                                <span>◉</span>
                            </button>

                        </div>

                    </div>


                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-input-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Repeat password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                                aria-label="Show password"
                            >
                                <span>◉</span>
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        id="registerBtn"
                        class="auth-primary-btn"
                    >
                        Create Account
                    </button>


                    <p
                        id="registerMessage"
                        class="auth-message"
                        aria-live="polite"
                    ></p>

                </form>


                <p class="create-account">

                    Already have an account?

                    <a href="login.html">
                        Sign in
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="../../assets/js/auth/register.js"
    ></script>

</body>

</html>
