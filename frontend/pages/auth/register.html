<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>sellersPro - Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/global.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/auth.css"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-container">

            <div class="auth-card">

                <div class="auth-header">

                    <h1>sellersPro</h1>

                    <h2>Create Account</h2>

                    <p>
                        Start managing your business with sellersPro.
                    </p>

                </div>


                <form id="registerForm">

                    <div class="mb-3">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Create Account
                    </button>

                </form>


                <div class="auth-footer">

                    <p>

                        Already have an account?

                        <a href="login.html">
                            Sign In
                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="../../assets/js/auth/register.js"
    ></script>

</body>

</html>
